name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tag must match default_version in pgaudix.control
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^default_version = '${VERSION}'$" pgaudix.control; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match pgaudix.control:"
            grep default_version pgaudix.control
            exit 1
          fi
          test -f "pgaudix--${VERSION}.sql" || { echo "ERROR: pgaudix--${VERSION}.sql not found"; exit 1; }
          echo "Releasing pgaudix ${VERSION}"

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg_version: [18, 17, 16]

    container:
      image: postgres:${{ matrix.pg_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential postgresql-server-dev-${{ matrix.pg_version }}

      - name: Build and install extension
        run: make USE_PGXS=1 && make USE_PGXS=1 install

      - name: Run tests
        run: |
          chown -R postgres:postgres .
          su postgres -c "pg_ctl -D /tmp/pgdata initdb"
          su postgres -c "pg_ctl -D /tmp/pgdata -l /tmp/pg.log start"
          su postgres -c "make USE_PGXS=1 installcheck"

      - name: Package release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="pgaudix-${VERSION}-pg${{ matrix.pg_version }}-linux-amd64"
          mkdir "$DIST"
          cp pgaudix.so pgaudix.control pgaudix--*.sql install.sh "$DIST/"
          chmod +x "$DIST/install.sh"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgaudix-pg${{ matrix.pg_version }}-linux-amd64
          path: pgaudix-*-linux-amd64.tar.gz

  build-windows:
    needs: check-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 with PostgreSQL
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-postgresql
            make
            zip
            diffutils

      - name: Build and install extension
        shell: msys2 {0}
        run: |
          PG_VERSION=$(pg_config --version | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          echo "Building for PostgreSQL $PG_VERSION"
          make USE_PGXS=1
          make USE_PGXS=1 install

      # The MSYS2 PostgreSQL ships a server, so the regression suite runs here
      # too. initdb/pg_ctl drop administrator privileges by themselves on
      # Windows; pg_regress connects over TCP to localhost (trust by default).
      # The server listens on both loopbacks: psql's \c reconnects to
      # "localhost" over ::1 and does not fall back to 127.0.0.1.
      # UTF8 like the other platforms: initdb picks WIN1252 on the runner.
      - name: Run tests
        shell: msys2 {0}
        run: |
          export PGUSER=postgres
          export PGHOST=127.0.0.1
          initdb -D /tmp/pgdata -U postgres -A trust -E UTF8 --no-locale
          pg_ctl -D /tmp/pgdata -l /tmp/pg.log -o "-c listen_addresses=127.0.0.1,::1" start
          make USE_PGXS=1 installcheck

      - name: Show test diff on failure
        if: failure()
        shell: msys2 {0}
        run: |
          cat regression.diffs || true
          cat /tmp/pg.log || true

      - name: Package release
        shell: msys2 {0}
        run: |
          PG_VERSION=$(pg_config --version | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="pgaudix-${VERSION}-pg${PG_VERSION}-windows-amd64"
          mkdir "$DIST"
          # Find the built shared library regardless of extension
          SHLIB=$(find . -maxdepth 1 -name 'pgaudix.dll' -o -name 'pgaudix.so' -o -name 'pgaudix.o' | grep -v '\.o$' | head -1)
          if [ -z "$SHLIB" ]; then
            echo "ERROR: No shared library found. Files in workspace:"
            ls -la
            exit 1
          fi
          echo "Found shared library: $SHLIB"
          cp "$SHLIB" "$DIST/pgaudix.dll"
          cp pgaudix.control pgaudix--*.sql install.bat "$DIST/"
          zip -r "${DIST}.zip" "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgaudix-windows-amd64
          path: pgaudix-*-windows-amd64.zip

  build-macos-arm64:
    needs: check-version
    runs-on: macos-14   # GitHub-hosted Apple Silicon (arm64)

    strategy:
      fail-fast: false
      matrix:
        pg_version: [18, 17, 16]

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg_version }}
        run: |
          brew update
          brew install postgresql@${{ matrix.pg_version }}

      - name: Build and install extension
        run: |
          PG_CONFIG="$(brew --prefix postgresql@${{ matrix.pg_version }})/bin/pg_config"
          echo "Building against $("$PG_CONFIG" --version) on $(uname -m)"
          make USE_PGXS=1 PG_CONFIG="$PG_CONFIG"
          make USE_PGXS=1 PG_CONFIG="$PG_CONFIG" install

      - name: Run tests
        run: |
          BREW_PG="$(brew --prefix postgresql@${{ matrix.pg_version }})"
          export PATH="$BREW_PG/bin:$PATH"
          export PGHOST=/tmp
          export PGUSER=postgres
          initdb -D /tmp/pgdata -U postgres
          pg_ctl -D /tmp/pgdata -l /tmp/pg.log -o "-k /tmp" start
          make USE_PGXS=1 PG_CONFIG="$BREW_PG/bin/pg_config" installcheck

      - name: Show test diff on failure
        if: failure()
        run: cat regression.diffs || true

      - name: Package release
        run: |
          # PostgreSQL loadable modules use the .dylib suffix on macOS
          test -f pgaudix.dylib || { echo "ERROR: pgaudix.dylib not found"; find . -maxdepth 1 -name 'pgaudix.*'; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="pgaudix-${VERSION}-pg${{ matrix.pg_version }}-macos-arm64"
          mkdir "$DIST"
          cp pgaudix.dylib pgaudix.control pgaudix--*.sql install.sh "$DIST/"
          chmod +x "$DIST/install.sh"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgaudix-pg${{ matrix.pg_version }}-macos-arm64
          path: pgaudix-*-macos-arm64.tar.gz

  release:
    needs: [build-linux, build-windows, build-macos-arm64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "pgaudix ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*
